name: Package and Push Helm Chart

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "charts/**"

jobs:
  helm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Log in to GHCR
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io \
            --username "${{ github.actor }}" --password-stdin

      - name: Set chart version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i "s/^version:.*/version: ${VERSION}/" charts/wordwall/Chart.yaml
          sed -i "s/^appVersion:.*/appVersion: \"${VERSION}\"/" charts/wordwall/Chart.yaml

      - name: Lint chart
        run: helm lint ./charts/wordwall

      - name: Package chart
        run: helm package ./charts/wordwall --destination /tmp/charts

      # - name: Push chart to GHCR
      #   run: |
      #     helm push /tmp/charts/wordwall-*.tgz oci://ghcr.io/${{ github.repository_owner }}/charts
