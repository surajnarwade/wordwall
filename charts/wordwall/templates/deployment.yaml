apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "wordwall.name" . }}
  labels:
    {{- include "wordwall.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      {{- include "wordwall.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "wordwall.labels" . | nindent 8 }}
    spec:
      containers:
        - name: {{ include "wordwall.name" . }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: PORT
              value: "8000"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
