# optional: defaults to the Helm release name when unset
name: ""

namespace: "playground"

backstage:
  component: "httpbin"

image:
  repository: ghcr.io/surajnarwade/wordwall
  tag: sha-5a13579
  pullPolicy: IfNotPresent

replicaCount: 1

service:
  port: 8000

probes:
  path: /health
  liveness:
    initialDelaySeconds: 10
    periodSeconds: 15
  readiness:
    initialDelaySeconds: 5
    periodSeconds: 10

resources: {}
  # limits:
  #   cpu: 500m
  #   memory: 256Mi
  # requests:
  #   cpu: 100m
  #   memory: 128Mi

istio:
  gateway: istio-ingress/public

virtualService:
  enabled: false
